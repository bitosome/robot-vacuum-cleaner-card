# Install custom_components/robot_cleaner_queue first, include this package, then restart HA.
# No physical command runs during setup or restart. See docs/queue-backend.md.
robot_cleaner_queue: {}

script:
  robot_cleaner_queue_control:
    alias: Robot cleaner queue control
    description: Wrapper used by the card. Queue execution belongs to Home Assistant.
    mode: parallel
    max: 10
    fields:
      command:
        required: true
        selector:
          select:
            options: [start, pause, resume, cancel, return_to_dock]
      vacuum:
        selector:
          entity:
            domain: vacuum
            integration: roborock
      presets:
        selector:
          entity:
            domain: button
            integration: roborock
            multiple: true
    sequence:
      - action: robot_cleaner_queue.control
        data:
          command: "{{ command }}"
          vacuum: "{{ vacuum | default('') }}"
          presets: "{{ presets | default([]) }}"
