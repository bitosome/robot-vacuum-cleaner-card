control:
  name: Control cleaning queue
  description: Start ordered saved presets or a manual cleaning plan, pause, resume, clear remaining jobs, or return to dock.
  fields:
    command:
      required: true
      selector:
        select:
          options: [start, start_manual, pause, resume, cancel, return_to_dock]
    vacuum:
      selector:
        entity:
          domain: vacuum
          integration: roborock
    presets:
      description: Ordered routine button entity IDs. Required for start; one room per routine.
      selector:
        entity:
          domain: button
          integration: roborock
          multiple: true
    rooms:
      description: Ordered Home Assistant area IDs for start_manual; empty means the whole current map. Each area must be mapped to this vacuum.
      selector:
        area:
          multiple: true
    setup:
      description: Manual mode, suction, water, route and repeat options returned by get_capabilities. Used only by start_manual.
      selector:
        object: {}
get_capabilities:
  name: Get manual cleaning capabilities
  description: Read cached native cleaning modes, settings and mapped areas for the current map. Does not change settings, switch maps, poll or start the robot. Returns a response.
  fields:
    vacuum:
      required: true
      selector:
        entity:
          domain: vacuum
          integration: roborock
