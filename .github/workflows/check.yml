name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check
      - run: python3 -B test/backend_queue_test.py
      - run: python3 -B test/backend_manual_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: robot-vacuum-cleaner-card
          path: dist/robot-vacuum-cleaner-card.js
