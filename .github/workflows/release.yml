name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check
      - run: python3 -B test/backend_queue_test.py
      - run: python3 -B test/backend_manual_test.py
      - run: zip -r robot-cleaner-queue.zip custom_components/robot_cleaner_queue packages/robot_cleaner_queue.yaml -x '*.pyc' '*/__pycache__/*'
      - name: Publish tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/robot-vacuum-cleaner-card.js robot-cleaner-queue.zip --generate-notes --verify-tag
